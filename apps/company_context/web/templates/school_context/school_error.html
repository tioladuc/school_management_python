<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Access Denied</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top left, #334155, transparent 40%), radial-gradient(circle at bottom right, #1e3a8a, transparent 40%), #0f172a;
        color: #ffffff;
        overflow: hidden;
      }
      
      .container {
        width: 90%;
        max-width: 520px;
        text-align: center;
        padding: 50px 40px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        animation: appear 0.7s ease-out;
      }
      
      .icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.15);
        border: 2px solid rgba(239, 68, 68, 0.5);
        font-size: 42px;
        animation: pulse 2s infinite;
      }
      
      h1 {
        font-size: 32px;
        margin-bottom: 15px;
        font-weight: 700;
      }
      
      .message {
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.7;
        margin-bottom: 30px;
      }
      
      .error-code {
        display: inline-block;
        margin-bottom: 30px;
        padding: 7px 14px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        color: #94a3b8;
        font-size: 13px;
        letter-spacing: 1px;
      }
      
      .button {
        display: inline-block;
        padding: 13px 28px;
        border: none;
        border-radius: 10px;
        background: #3b82f6;
        color: white;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.25s ease;
      }
      
      .button:hover {
        background: #2563eb;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      }
      
      .button:active {
        transform: translateY(0);
      }
      
      .footer {
        margin-top: 25px;
        color: #64748b;
        font-size: 12px;
      }
      
      .loader {
        display: none;
        margin: 20px auto 0;
        width: 25px;
        height: 25px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(25px) scale(0.97);
        }
      
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
      
        50% {
          transform: scale(1.05);
        }
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      
      @media (max-width: 500px) {
        .container {
          padding: 40px 25px;
        }
      
        h1 {
          font-size: 27px;
        }
      
        .message {
          font-size: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="icon">🔒</div>

      <h1>You Are Not Authorized</h1>

      <p class="message">Sorry, you don't have permission to access this page. Please make sure you have selected a valid company and that your account has the required access.</p>

      <div class="error-code">ERROR 403 · ACCESS DENIED</div>

      <br />

      <div class="loader" id="loader"></div>

      <div class="footer">If you believe this is an error, please contact your administrator.</div>
    </div>

    <script>
      document.getElementById('loginButton').addEventListener('click', function () {
        const button = this
        const loader = document.getElementById('loader')
      
        button.style.opacity = '0.6'
        button.style.pointerEvents = 'none'
      
        loader.style.display = 'block'
      })
    </script>
  </body>
</html>
